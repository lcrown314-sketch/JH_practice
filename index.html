<h1>치이카와</h1>
<p>치이카와는 나가노(ナガノ) 작가의 인스타그램 만화에서 시작된 캐릭터로, 작고 동글동글한 외모의 더울이·치이카와·하치와레·우사기 등의 조그만 동물 캐릭터들을 중심으로 한 일상 코미디 작품입니다.</p>
<p>귀여운 그림체와 따뜻하면서도 가끔은 시니컬한 유머, 작가 특유의 짧은 대사와 판타지·모험 요소가 어우러져 많은 팬을 끌었으며, 애니메이션·굿즈·게임 등 다양한 미디어로 확장되었습니다.</p>
